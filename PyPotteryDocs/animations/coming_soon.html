<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animation coming soon</title>
<!--
  Placeholder shown where a video walkthrough of a sub-app is still to come.
  Self-contained (no external requests) and sized by its iframe: embed it from a page in a sub-folder (pypotterylens/, ...) with
    <iframe src="../animations/coming_soon.html" name="Step name" style="width:100%;height:260px;border:none;" scrolling="no"></iframe>
  The iframe name (or the text after #) is optional and is shown as a small label above the message.
-->
<style>
  :root {
    --ink: #1c1309;
    --ink-soft: #6b5b48;
    --brand: #c2410c;
    --amber: #fbbf24;
    --amber-off: #92400e;
    --paper: #fbf7f1;
    --line: rgba(194, 65, 12, 0.28);
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: transparent;
    font-family: "Plus Jakarta Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    overflow: hidden;
  }

  .panel {
    width: 100%;
    height: 100%;
    max-width: 900px;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    background: var(--paper);
    border: 2px dashed var(--line);
    border-radius: 14px;
    text-align: center;
  }

  /* The barrier: two lights, a striped bar, two legs */
  .barrier {
    position: relative;
    width: 230px;
    height: 84px;
    flex: none;
  }

  .bar {
    position: absolute;
    left: 0;
    right: 0;
    top: 24px;
    height: 34px;
    border-radius: 6px;
    background: repeating-linear-gradient(-45deg, var(--amber) 0 16px, var(--ink) 16px 32px);
    box-shadow: 0 3px 0 rgba(28, 19, 9, 0.18);
    z-index: 2;
  }

  .leg {
    position: absolute;
    top: 56px;
    width: 12px;
    height: 28px;
    background: #8a7b68;
    border-radius: 0 0 3px 3px;
  }
  .leg.l { left: 30px; }
  .leg.r { right: 30px; }

  .lamp {
    position: absolute;
    top: 4px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--amber-off);
    box-shadow: 0 0 0 3px #4b3a28;
    z-index: 1;
  }
  .lamp.l { left: 34px; animation: blink 1.1s steps(1, end) infinite; }
  .lamp.r { right: 34px; animation: blink 1.1s steps(1, end) infinite reverse; }

  @keyframes blink {
    0%   { background: var(--amber); box-shadow: 0 0 0 3px #4b3a28, 0 0 22px 6px rgba(251, 191, 36, 0.75); }
    50%  { background: var(--amber-off); box-shadow: 0 0 0 3px #4b3a28; }
  }

  /* the bar drifts a hair, like a sign being put up */
  .barrier { animation: settle 3.2s ease-in-out infinite; }
  @keyframes settle {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  .label {
    margin: 0;
    min-height: 1em;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--brand);
  }
  .label:empty { display: none; }

  .title {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 800;
    letter-spacing: -0.01em;
  }

  .sub {
    margin: 0;
    max-width: 34em;
    font-size: 0.86rem;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .barrier, .lamp { animation: none; }
    .lamp.l { background: var(--amber); box-shadow: 0 0 0 3px #4b3a28, 0 0 18px 4px rgba(251, 191, 36, 0.6); }
  }

  @media (max-height: 240px) {
    .barrier { transform: scale(0.8); margin: -8px 0; animation: none; }
  }
</style>
</head>
<body>
  <div class="panel" role="img" aria-label="Animation coming soon">
    <div class="barrier" aria-hidden="true">
      <div class="lamp l"></div>
      <div class="lamp r"></div>
      <div class="bar"></div>
      <div class="leg l"></div>
      <div class="leg r"></div>
    </div>
    <p class="label" id="label"></p>
    <p class="title">Animation coming soon</p>
    <p class="sub">A video walkthrough of this step is being prepared. The text above already describes what it will show.</p>
  </div>
  <script>
    (function () {
      var raw = window.name || decodeURIComponent((location.hash || '').slice(1));
      if (raw) document.getElementById('label').textContent = raw;
    })();
  </script>
</body>
</html>
