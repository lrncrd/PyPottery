<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Silicon Animation - PyPottery Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            overflow: hidden;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .icon-container {
            width: 88px;
            height: 88px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.35s ease;
            filter: drop-shadow(0 6px 16px rgba(120, 53, 15, 0.18));
        }

        .icon-container:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 10px 24px rgba(194, 65, 12, 0.38));
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        /* Apple Logo Breathing & Warm Pulse */
        .apple-logo {
            animation: appleBreath 2.8s ease-in-out infinite alternate;
            transform-origin: 100px 100px;
        }

        @keyframes appleBreath {
            0% {
                transform: scale(0.96);
                opacity: 0.94;
                filter: drop-shadow(0 2px 6px rgba(194, 65, 12, 0.25));
            }
            100% {
                transform: scale(1.02);
                opacity: 1;
                filter: drop-shadow(0 6px 18px rgba(234, 88, 12, 0.6));
            }
        }
    </style>
</head>

<body>

    <div class="icon-container" id="apple-container" title="Apple Silicon Metal Acceleration">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Warm Archaeological Terracotta & Amber Gold Gradient -->
                <linearGradient id="apple-terra-gold" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#fde68a"/>
                    <stop offset="25%" stop-color="#fbbf24"/>
                    <stop offset="60%" stop-color="#ea580c"/>
                    <stop offset="100%" stop-color="#c2410c"/>
                </linearGradient>

                <!-- Subtle Inner Specular Light Sheen -->
                <linearGradient id="apple-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
                    <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
                    <stop offset="100%" stop-color="#9a3412" stop-opacity="0.25"/>
                </linearGradient>
            </defs>

            <!-- ONLY THE APPLE LOGO -->
            <g class="apple-logo" transform="translate(100, 100) scale(0.72) translate(-100, -76.5)">
                <!-- Apple Silhouette (Leaf & Body with Bite) -->
                <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.92-3.26-7.85-8.08-11.78-14.47-5.99-9.8-10.66-20.76-14.01-32.88-3.36-12.12-5.04-23.75-5.04-34.9 0-14.04 3.73-25.59 11.19-34.66 7.46-9.08 16.71-13.72 27.75-13.93 4.8 0 10.12 1.25 15.96 3.75 5.84 2.51 9.8 3.86 11.88 4.06 1.74-.2 5.99-1.63 12.74-4.29 6.76-2.67 12.39-3.9 16.89-3.7 12.52.84 22.25 5.43 29.19 13.77-10.99 6.64-16.36 15.93-16.11 27.86.26 9.4 3.96 17.22 11.1 23.46 7.15 6.24 15.69 9.87 25.64 10.88-2.61 8.06-6.19 16.53-10.74 25.43zm-31.75-113.82c0-7.39 2.67-14.28 8.02-20.67 5.34-6.39 12.01-10.37 20-11.94.87 6.96-.98 13.87-5.55 20.74-4.57 6.87-11.38 10.82-20.43 11.87-.22-.65-.47-1.3-.74-1.94-.87-2.17-1.3-4.19-1.3-6.06z" 
                      fill="url(#apple-terra-gold)" 
                      stroke="#ffedd5" 
                      stroke-width="1.8" 
                      stroke-opacity="0.9"/>
                
                <!-- Inner Sheen Overlay for Ceramic / Metallic Depth -->
                <path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.92-3.26-7.85-8.08-11.78-14.47-5.99-9.8-10.66-20.76-14.01-32.88-3.36-12.12-5.04-23.75-5.04-34.9 0-14.04 3.73-25.59 11.19-34.66 7.46-9.08 16.71-13.72 27.75-13.93 4.8 0 10.12 1.25 15.96 3.75 5.84 2.51 9.8 3.86 11.88 4.06 1.74-.2 5.99-1.63 12.74-4.29 6.76-2.67 12.39-3.9 16.89-3.7 12.52.84 22.25 5.43 29.19 13.77-10.99 6.64-16.36 15.93-16.11 27.86.26 9.4 3.96 17.22 11.1 23.46 7.15 6.24 15.69 9.87 25.64 10.88-2.61 8.06-6.19 16.53-10.74 25.43zm-31.75-113.82c0-7.39 2.67-14.28 8.02-20.67 5.34-6.39 12.01-10.37 20-11.94.87 6.96-.98 13.87-5.55 20.74-4.57 6.87-11.38 10.82-20.43 11.87-.22-.65-.47-1.3-.74-1.94-.87-2.17-1.3-4.19-1.3-6.06z" 
                      fill="url(#apple-sheen)"/>
            </g>
        </svg>
    </div>

    <script>
        const container = document.getElementById('apple-container');
        let turbo = false;

        container.addEventListener('click', () => {
            turbo = !turbo;
            const logo = document.querySelector('.apple-logo');

            if (turbo) {
                logo.style.animationDuration = '0.7s';
                container.style.filter = 'drop-shadow(0 12px 28px rgba(234, 88, 12, 0.55))';
            } else {
                logo.style.animationDuration = '2.8s';
                container.style.filter = 'drop-shadow(0 6px 16px rgba(120, 53, 15, 0.18))';
            }
        });
    </script>
</body>

</html>
