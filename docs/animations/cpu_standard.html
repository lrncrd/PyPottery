<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPU Standard Animation</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .icon-container {
            width: 88px;
            height: 88px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: drop-shadow(0 6px 14px rgba(15, 23, 42, 0.16));
        }

        .icon-container:hover {
            transform: scale(1.12);
            filter: drop-shadow(0 10px 22px rgba(14, 165, 233, 0.3));
        }

        svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        /* Core Breathing Glow */
        .cpu-core-glow {
            animation: coreBreath 2.4s ease-in-out infinite;
        }

        @keyframes coreBreath {
            0%, 100% {
                opacity: 0.65;
                transform: scale(0.98);
            }
            50% {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        /* Circuit Pulse */
        .circuit-flow {
            stroke-dasharray: 12 8;
            animation: circuitFlow 1.6s linear infinite;
        }

        @keyframes circuitFlow {
            to {
                stroke-dashoffset: -40;
            }
        }

        /* Pin Glow Animation */
        .pin-glow {
            animation: pinPulse 2s ease-in-out infinite;
        }

        @keyframes pinPulse {
            0%, 100% {
                stroke: #94a3b8;
            }
            50% {
                stroke: #38bdf8;
                filter: drop-shadow(0 0 2px #38bdf8);
            }
        }

        /* Activity LED */
        .activity-led {
            animation: ledBlink 1.2s ease-in-out infinite alternate;
        }

        @keyframes ledBlink {
            0% {
                opacity: 0.3;
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
                filter: drop-shadow(0 0 4px #10b981);
            }
        }
    </style>
</head>

<body>

    <div class="icon-container" id="cpu-container">
        <svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Substrate Gradient -->
                <linearGradient id="substrate-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#1e293b"/>
                    <stop offset="100%" stop-color="#0f172a"/>
                </linearGradient>

                <!-- IHS Metallic Heatspreader -->
                <linearGradient id="ihs-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f8fafc"/>
                    <stop offset="30%" stop-color="#e2e8f0"/>
                    <stop offset="70%" stop-color="#cbd5e1"/>
                    <stop offset="100%" stop-color="#94a3b8"/>
                </linearGradient>

                <!-- Silicon Die Core -->
                <linearGradient id="silicon-die" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0284c7"/>
                    <stop offset="50%" stop-color="#0369a1"/>
                    <stop offset="100%" stop-color="#0f172a"/>
                </linearGradient>

                <!-- Circuit Glow Gradient -->
                <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#38bdf8"/>
                    <stop offset="100%" stop-color="#0284c7"/>
                </linearGradient>
            </defs>

            <!-- External Gold / Metallic Connector Pins -->
            <!-- Top Pins -->
            <g class="pin-glow">
                <line x1="60" y1="8" x2="60" y2="30" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="85" y1="8" x2="85" y2="30" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="115" y1="8" x2="115" y2="30" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="140" y1="8" x2="140" y2="30" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>

                <!-- Bottom Pins -->
                <line x1="60" y1="170" x2="60" y2="192" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="85" y1="170" x2="85" y2="192" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="115" y1="170" x2="115" y2="192" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="140" y1="170" x2="140" y2="192" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>

                <!-- Left Pins -->
                <line x1="8" y1="60" x2="30" y2="60" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="8" y1="85" x2="30" y2="85" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="8" y1="115" x2="30" y2="115" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="8" y1="140" x2="30" y2="140" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>

                <!-- Right Pins -->
                <line x1="170" y1="60" x2="192" y2="60" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="170" y1="85" x2="192" y2="85" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="170" y1="115" x2="192" y2="115" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
                <line x1="170" y1="140" x2="192" y2="140" stroke="#94a3b8" stroke-width="7" stroke-linecap="round"/>
            </g>

            <!-- PCB Green/Slate Substrate -->
            <rect x="25" y="25" width="150" height="150" rx="16" fill="url(#substrate-grad)" stroke="#334155" stroke-width="3"/>

            <!-- Gold Pin 1 Corner Alignment Triangle -->
            <polygon points="32,32 44,32 32,44" fill="#f59e0b"/>

            <!-- High-Precision Nickel Heat Spreader (IHS) -->
            <rect x="42" y="42" width="116" height="116" rx="12" fill="url(#ihs-grad)" stroke="#475569" stroke-width="2.5"/>
            <rect x="46" y="46" width="108" height="108" rx="8" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="1.5"/>

            <!-- Circuit Bus Traces -->
            <g class="circuit-flow" stroke="url(#glow-cyan)" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
                <path d="M 52,65 L 75,65 L 75,80"/>
                <path d="M 148,65 L 125,65 L 125,80"/>
                <path d="M 52,135 L 75,135 L 75,120"/>
                <path d="M 148,135 L 125,135 L 125,120"/>
            </g>

            <!-- Central Processing Core / Silicon Die -->
            <g class="cpu-core-glow" style="transform-origin: 100px 100px;">
                <rect x="70" y="70" width="60" height="60" rx="8" fill="url(#silicon-die)" stroke="#38bdf8" stroke-width="2"/>
                <rect x="74" y="74" width="52" height="52" rx="6" fill="none" stroke="#7dd3fc" stroke-opacity="0.3" stroke-width="1"/>

                <!-- Micro-Core Grid Matrix -->
                <rect x="80" y="80" width="16" height="16" rx="2" fill="#0284c7" opacity="0.75"/>
                <rect x="104" y="80" width="16" height="16" rx="2" fill="#0284c7" opacity="0.75"/>
                <rect x="80" y="104" width="16" height="16" rx="2" fill="#0284c7" opacity="0.75"/>
                <rect x="104" y="104" width="16" height="16" rx="2" fill="#0284c7" opacity="0.75"/>

                <!-- Central Laser Engraving Symbol -->
                <circle cx="100" cy="100" r="4" fill="#38bdf8"/>
            </g>

            <!-- Micro LED Indicators -->
            <circle cx="56" cy="56" r="3" fill="#10b981" class="activity-led"/>
            <circle cx="144" cy="56" r="3" fill="#38bdf8" class="activity-led" style="animation-delay: 0.6s;"/>
            <circle cx="144" cy="144" r="3" fill="#f59e0b" class="activity-led" style="animation-delay: 0.3s;"/>
        </svg>
    </div>

    <script>
        const container = document.getElementById('cpu-container');
        let turbo = false;

        container.addEventListener('click', () => {
            turbo = !turbo;
            const core = document.querySelector('.cpu-core-glow');
            const circuits = document.querySelectorAll('.circuit-flow');

            if (turbo) {
                core.style.animationDuration = '0.7s';
                circuits.forEach(c => c.style.animationDuration = '0.5s');
            } else {
                core.style.animationDuration = '2.4s';
                circuits.forEach(c => c.style.animationDuration = '1.6s');
            }
        });
    </script>
</body>

</html>
